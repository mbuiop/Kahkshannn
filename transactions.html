<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تراکنش‌ها — دفتر حساب</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="transactions" data-title="تراکنش‌ها" data-sub="مدیریت دخل و خرج روزانه">
<div class="app-shell">
  <aside class="sidebar" id="sidebarNav"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>

    <div class="panel">
      <h2 id="formTitle">ثبت تراکنش جدید</h2>
      <form id="txnForm">
        <div class="form-grid" style="margin-bottom:10px;">
          <div class="field">
            <label>نوع</label>
            <div class="type-toggle">
              <button type="button" data-type="expense" class="active">هزینه</button>
              <button type="button" data-type="income">درآمد</button>
            </div>
          </div>
          <div class="field"><label>مبلغ (تومان)</label><input type="number" id="amount" min="0" required></div>
          <div class="field"><label>تاریخ</label><input type="date" id="date" required></div>
          <div class="field"><label>دسته‌بندی</label><select id="category"></select></div>
          <div class="field"><label>طرف‌حساب (اختیاری)</label><select id="contact"><option value="">—</option></select></div>
          <div class="field"><label>یادداشت</label><input type="text" id="note" placeholder="توضیح کوتاه"></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button type="submit" class="btn" id="submitBtn">افزودن تراکنش</button>
          <button type="button" class="btn secondary" id="cancelEdit" style="display:none;">انصراف از ویرایش</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>فهرست تراکنش‌ها</h2>
      <div class="filterbar">
        <select id="filterMonth"></select>
        <select id="filterType"><option value="">همه انواع</option><option value="income">درآمد</option><option value="expense">هزینه</option></select>
        <select id="filterCategory"><option value="">همه دسته‌ها</option></select>
        <input type="text" id="filterSearch" placeholder="جستجو در یادداشت‌ها...">
        <div class="spacer"></div>
        <button class="btn secondary small" id="btnClearFilters">پاک‌کردن فیلتر</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>تاریخ</th><th>نوع</th><th>دسته</th><th>طرف‌حساب</th><th>یادداشت</th><th>مبلغ</th><th></th></tr></thead>
          <tbody id="txnBody"></tbody>
        </table>
      </div>
      <div class="empty-note" id="emptyNote" style="display:none;">هنوز تراکنشی ثبت نشده.</div>
    </div>
  </main>
</div>

<script src="js/db.js"></script>
<script src="js/charts.js"></script>
<script src="js/nav.js"></script>
<script>
var currentType = 'expense';
var editingId = null;

function fillCategories(){
  var cats = DB.getCategories();
  var sel = document.getElementById('category');
  sel.innerHTML = '';
  (cats[currentType]||[]).forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
}
function fillFilterCategories(){
  var cats = DB.getCategories();
  var all = (cats.income||[]).concat(cats.expense||[]);
  var uniq = Array.from(new Set(all));
  var sel = document.getElementById('filterCategory');
  var cur = sel.value;
  sel.innerHTML = '<option value="">همه دسته‌ها</option>';
  uniq.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
  sel.value = cur;
}
function fillContacts(){
  var sel = document.getElementById('contact');
  sel.innerHTML = '<option value="">—</option>';
  DB.getContacts().forEach(function(c){ var o=document.createElement('option'); o.value=c.id; o.textContent=c.name; sel.appendChild(o); });
}

document.querySelectorAll('.type-toggle button').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.type-toggle button').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    currentType = btn.dataset.type;
    fillCategories();
  });
});

document.getElementById('date').valueAsDate = new Date();

document.getElementById('txnForm').addEventListener('submit', function(e){
  e.preventDefault();
  var amount = parseFloat(document.getElementById('amount').value);
  var gDate = document.getElementById('date').value;
  if(!amount || amount<=0 || !gDate) return;
  var j = gDateToJalali(gDate);
  var txns = DB.getTransactions();
  var payload = {
    type: currentType,
    amount: amount,
    category: document.getElementById('category').value,
    contactId: document.getElementById('contact').value || null,
    note: document.getElementById('note').value.trim(),
    jy:j[0], jm:j[1], jd:j[2], gDate: gDate
  };
  if(editingId){
    txns = txns.map(function(t){ return t.id===editingId ? Object.assign({},t,payload) : t; });
    stopEditing();
  } else {
    payload.id = uid();
    txns.push(payload);
  }
  DB.saveTransactions(txns);
  document.getElementById('txnForm').reset();
  document.getElementById('date').valueAsDate = new Date();
  fillCategories();
  renderAll();
});

function startEditing(id){
  var t = DB.getTransactions().find(function(x){ return x.id===id; });
  if(!t) return;
  editingId = id;
  currentType = t.type;
  document.querySelectorAll('.type-toggle button').forEach(function(b){ b.classList.toggle('active', b.dataset.type===t.type); });
  fillCategories();
  document.getElementById('amount').value = t.amount;
  document.getElementById('date').value = t.gDate;
  document.getElementById('category').value = t.category;
  document.getElementById('contact').value = t.contactId || '';
  document.getElementById('note').value = t.note || '';
  document.getElementById('formTitle').textContent = 'ویرایش تراکنش';
  document.getElementById('submitBtn').textContent = 'ذخیره تغییرات';
  document.getElementById('cancelEdit').style.display = 'inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function stopEditing(){
  editingId = null;
  document.getElementById('formTitle').textContent = 'ثبت تراکنش جدید';
  document.getElementById('submitBtn').textContent = 'افزودن تراکنش';
  document.getElementById('cancelEdit').style.display = 'none';
}
document.getElementById('cancelEdit').addEventListener('click', function(){
  document.getElementById('txnForm').reset();
  document.getElementById('date').valueAsDate = new Date();
  stopEditing();
});

function populateMonthFilter(){
  var sel = document.getElementById('filterMonth');
  var keys = {};
  DB.getTransactions().forEach(function(t){ keys[jalaliKey(t.jy,t.jm)] = [t.jy,t.jm]; });
  var t0 = todayJalali();
  keys[jalaliKey(t0[0],t0[1])] = [t0[0],t0[1]];
  var sortedKeys = Object.keys(keys).sort().reverse();
  var current = sel.value;
  sel.innerHTML = '<option value="">همه ماه‌ها</option>';
  sortedKeys.forEach(function(k){
    var ym = keys[k]; var o=document.createElement('option'); o.value=k; o.textContent=jMonths[ym[1]-1]+' '+toFa(ym[0]); sel.appendChild(o);
  });
  if(current && sortedKeys.indexOf(current)!==-1) sel.value=current; else sel.value = jalaliKey(t0[0],t0[1]);
}
['filterMonth','filterType','filterCategory'].forEach(function(id){ document.getElementById(id).addEventListener('change', renderTable); });
document.getElementById('filterSearch').addEventListener('input', renderTable);
document.getElementById('btnClearFilters').addEventListener('click', function(){
  document.getElementById('filterType').value='';
  document.getElementById('filterCategory').value='';
  document.getElementById('filterSearch').value='';
  var t0=todayJalali();
  document.getElementById('filterMonth').value = jalaliKey(t0[0],t0[1]);
  renderTable();
});

function getFiltered(){
  var monthKey = document.getElementById('filterMonth').value;
  var type = document.getElementById('filterType').value;
  var cat = document.getElementById('filterCategory').value;
  var search = document.getElementById('filterSearch').value.trim().toLowerCase();
  return DB.getTransactions().filter(function(t){
    if(monthKey && jalaliKey(t.jy,t.jm)!==monthKey) return false;
    if(type && t.type!==type) return false;
    if(cat && t.category!==cat) return false;
    if(search && (t.note||'').toLowerCase().indexOf(search)===-1) return false;
    return true;
  });
}

function renderTable(){
  var body = document.getElementById('txnBody');
  var list = getFiltered().slice().sort(function(a,b){ return (b.jy-a.jy)||(b.jm-a.jm)||(b.jd-a.jd); });
  document.getElementById('emptyNote').style.display = DB.getTransactions().length===0 ? 'block':'none';
  body.innerHTML = list.map(function(t){
    return '<tr><td>'+jalaliStr(t.jy,t.jm,t.jd)+'</td>'+
      '<td><span class="tag">'+(t.type==='income'?'درآمد':'هزینه')+'</span></td>'+
      '<td>'+t.category+'</td>'+
      '<td>'+(t.contactId? DB.contactName(t.contactId) : '—')+'</td>'+
      '<td>'+(t.note||'—')+'</td>'+
      '<td class="amt-cell '+t.type+'">'+(t.type==='income'?'+':'−')+' '+fmtMoney(t.amount)+'</td>'+
      '<td class="row-actions"><button data-edit="'+t.id+'">ویرایش</button><button data-del="'+t.id+'">حذف</button></td></tr>';
  }).join('');
  body.querySelectorAll('[data-edit]').forEach(function(b){ b.addEventListener('click', function(){ startEditing(b.dataset.edit); }); });
  body.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click', function(){
    if(!confirm('این تراکنش حذف شود؟')) return;
    DB.saveTransactions(DB.getTransactions().filter(function(t){ return t.id!==b.dataset.del; }));
    renderAll();
  }); });
}

function renderAll(){ populateMonthFilter(); fillFilterCategories(); renderTable(); }
fillCategories(); fillContacts(); renderAll();
</script>
</body>
</html>
