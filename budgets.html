<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بودجه‌بندی — دفتر حساب</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="budgets" data-title="بودجه‌بندی" data-sub="سقف هزینه برای هر دسته در ماه جاری">
<div class="app-shell">
  <aside class="sidebar" id="sidebarNav"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>

    <div class="panel">
      <h2>تعیین سقف بودجه</h2>
      <div class="form-grid">
        <div class="field"><label>دسته هزینه</label><select id="budgetCategory"></select></div>
        <div class="field"><label>سقف بودجه ماهانه (تومان)</label><input type="number" id="budgetAmount" min="0"></div>
        <div class="field" style="align-self:end;"><button class="btn" id="btnSetBudget">ثبت سقف</button></div>
      </div>
    </div>

    <div class="panel">
      <h2 id="budgetTitle">وضعیت بودجه این ماه</h2>
      <div id="budgetList"></div>
    </div>
  </main>
</div>

<script src="js/db.js"></script>
<script src="js/charts.js"></script>
<script src="js/nav.js"></script>
<script>
function fillCategories(){
  var sel = document.getElementById('budgetCategory');
  sel.innerHTML = '';
  (DB.getCategories().expense||[]).forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
}

document.getElementById('btnSetBudget').addEventListener('click', function(){
  var cat = document.getElementById('budgetCategory').value;
  var amt = parseFloat(document.getElementById('budgetAmount').value);
  if(!cat || !amt || amt<=0) return;
  var budgets = DB.getBudgets();
  budgets[cat] = amt;
  DB.saveBudgets(budgets);
  document.getElementById('budgetAmount').value='';
  renderBudgets();
});

function renderBudgets(){
  var t0 = todayJalali();
  var mKey = jalaliKey(t0[0],t0[1]);
  document.getElementById('budgetTitle').textContent = 'وضعیت بودجه — '+jMonths[t0[1]-1]+' '+toFa(t0[0]);
  var spent = {};
  DB.getTransactions().forEach(function(t){
    if(t.type==='expense' && jalaliKey(t.jy,t.jm)===mKey) spent[t.category]=(spent[t.category]||0)+t.amount;
  });
  var budgets = DB.getBudgets();
  var keys = Object.keys(budgets).filter(function(c){ return budgets[c]>0; });
  var list = document.getElementById('budgetList');
  if(keys.length===0){ list.innerHTML='<div class="empty-note">هنوز سقف بودجه‌ای تعیین نشده</div>'; return; }
  list.innerHTML = keys.map(function(cat){
    var limit = budgets[cat], sp = spent[cat]||0;
    var pct = Math.min(100, Math.round((sp/limit)*100));
    var over = sp>limit;
    return '<div class="budget-item"><div class="top"><span>'+cat+(over?' — بیش از سقف!':'')+'</span><span>'+fmtMoney(sp)+' / '+fmtMoney(limit)+'</span></div>'+
      '<div class="bar-bg"><div class="bar-fill'+(over?' over':'')+'" style="width:'+pct+'%"></div></div></div>';
  }).join('');
}

fillCategories(); renderBudgets();
</script>
</body>
</html>
