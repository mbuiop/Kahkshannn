<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طرف‌حساب‌ها — دفتر حساب</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contacts" data-title="طرف‌حساب‌ها" data-sub="مشتریان، تأمین‌کنندگان و سایر طرف‌های حساب">
<div class="app-shell">
  <aside class="sidebar" id="sidebarNav"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>

    <div class="panel">
      <h2 id="formTitle">افزودن طرف‌حساب</h2>
      <form id="contactForm" class="form-grid">
        <div class="field"><label>نام</label><input type="text" id="cName" required></div>
        <div class="field"><label>نوع</label>
          <select id="cType"><option value="customer">مشتری</option><option value="vendor">تأمین‌کننده</option><option value="other">سایر</option></select>
        </div>
        <div class="field"><label>شماره تماس</label><input type="text" id="cPhone"></div>
        <div class="field"><label>یادداشت</label><input type="text" id="cNote"></div>
        <div class="field" style="align-self:end; display:flex; gap:8px;">
          <button type="submit" class="btn" id="submitBtn">افزودن</button>
          <button type="button" class="btn secondary" id="cancelEdit" style="display:none;">انصراف</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>فهرست طرف‌حساب‌ها</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>نام</th><th>نوع</th><th>تماس</th><th>یادداشت</th><th>مانده تراکنش‌ها</th><th></th></tr></thead>
          <tbody id="cBody"></tbody>
        </table>
      </div>
      <div class="empty-note" id="emptyNote" style="display:none;">هنوز طرف‌حسابی ثبت نشده.</div>
    </div>
  </main>
</div>

<script src="js/db.js"></script>
<script src="js/charts.js"></script>
<script src="js/nav.js"></script>
<script>
var TYPE_LABEL = { customer:'مشتری', vendor:'تأمین‌کننده', other:'سایر' };
var editingId = null;

document.getElementById('contactForm').addEventListener('submit', function(e){
  e.preventDefault();
  var name = document.getElementById('cName').value.trim();
  if(!name) return;
  var contacts = DB.getContacts();
  var payload = { name:name, type:document.getElementById('cType').value, phone:document.getElementById('cPhone').value.trim(), note:document.getElementById('cNote').value.trim() };
  if(editingId){
    contacts = contacts.map(function(c){ return c.id===editingId ? Object.assign({},c,payload) : c; });
    stopEditing();
  } else {
    payload.id = uid();
    contacts.push(payload);
  }
  DB.saveContacts(contacts);
  document.getElementById('contactForm').reset();
  renderTable();
});

function startEditing(id){
  var c = DB.getContacts().find(function(x){ return x.id===id; });
  if(!c) return;
  editingId = id;
  document.getElementById('cName').value = c.name;
  document.getElementById('cType').value = c.type;
  document.getElementById('cPhone').value = c.phone || '';
  document.getElementById('cNote').value = c.note || '';
  document.getElementById('formTitle').textContent = 'ویرایش طرف‌حساب';
  document.getElementById('submitBtn').textContent = 'ذخیره تغییرات';
  document.getElementById('cancelEdit').style.display = 'inline-block';
}
function stopEditing(){
  editingId = null;
  document.getElementById('formTitle').textContent = 'افزودن طرف‌حساب';
  document.getElementById('submitBtn').textContent = 'افزودن';
  document.getElementById('cancelEdit').style.display = 'none';
}
document.getElementById('cancelEdit').addEventListener('click', function(){ document.getElementById('contactForm').reset(); stopEditing(); });

function balanceFor(contactId){
  var sum = 0;
  DB.getTransactions().forEach(function(t){ if(t.contactId===contactId) sum += (t.type==='income'? t.amount : -t.amount); });
  DB.getCheques().forEach(function(c){ if(c.contactId===contactId && c.status!=='cancelled') sum += (c.type==='received'? c.amount : -c.amount); });
  return sum;
}

function renderTable(){
  var contacts = DB.getContacts();
  document.getElementById('emptyNote').style.display = contacts.length===0 ? 'block':'none';
  var body = document.getElementById('cBody');
  body.innerHTML = contacts.map(function(c){
    var bal = balanceFor(c.id);
    var cls = bal>0?'income':(bal<0?'expense':'');
    return '<tr><td>'+c.name+'</td><td><span class="tag">'+TYPE_LABEL[c.type]+'</span></td><td>'+(c.phone||'—')+'</td><td>'+(c.note||'—')+'</td>'+
      '<td class="amt-cell '+cls+'">'+fmtMoney(bal)+'</td>'+
      '<td class="row-actions"><button data-edit="'+c.id+'">ویرایش</button><button data-del="'+c.id+'">حذف</button></td></tr>';
  }).join('');
  body.querySelectorAll('[data-edit]').forEach(function(b){ b.addEventListener('click', function(){ startEditing(b.dataset.edit); }); });
  body.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click', function(){
    if(!confirm('این طرف‌حساب حذف شود؟ (تراکنش‌های مرتبط حذف نمی‌شوند)')) return;
    DB.saveContacts(DB.getContacts().filter(function(c){ return c.id!==b.dataset.del; }));
    renderTable();
  }); });
}
renderTable();
</script>
</body>
</html>
